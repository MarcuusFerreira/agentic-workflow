services:
  postgres:
    image: postgres:17-alpine
    container_name: agentic-workflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_workflow
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: