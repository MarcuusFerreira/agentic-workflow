spring:
  application:
    name: agentic-workflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_workflow}
    username: ${DB_USERNAME:agentic}
    password: ${DB_PASSWORD:agentic}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  jdbc:
    template:
      query-timeout: 30s

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: qwen3:8b
        temperature: 0.7

  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true
